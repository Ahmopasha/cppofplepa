name: Kod denetimi

# Kitaptaki kod örneklerini GCC ve Clang ile derler (araclar/kod_denetimi.py).
# Şimdilik yalnızca rapor üretir; rapor işin özetine ve "kod-denetimi" yapıtına konur.

on:
  push:
    branches: [main]
    paths: ["cilt-*/**", "araclar/**", ".github/workflows/kod-denetimi.yml"]
  pull_request:
    paths: ["cilt-*/**", "araclar/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denetim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Derleyiciler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-18
          # Ubuntu 24.04 çekirdeğindeki yüksek ASLR ayarı ThreadSanitizer'ı çalıştırmaz.
          sudo sysctl vm.mmap_rnd_bits=28
          g++-14 --version | head -1
          clang++-18 --version | head -1

      - name: Kod denetimi (yalnızca rapor)
        run: python3 araclar/kod_denetimi.py --derleyici g++-14 --derleyici clang++-18

      - name: Raporu özete ekle
        if: always()
        run: cat cikti/kod_denetimi.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kod-denetimi
          path: cikti/kod_denetimi.md
